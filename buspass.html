<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset><h1 align = "center"><strong>TELANGANA STATE ROAD TRANSPORT CORPORATION</strong></h1>
        <h2 align="center"><b>GENERAL BUS PASS APPLICATION</b></h2>
        </fieldset><br>
        <fieldset>
            <legend><b>Applicant Details</b></legend>
            <label for="name">Name</label>&nbsp;
            <input id="name" type="text" maxlength="20" required>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label for="fname">Father's/Guardian's Name</label>&nbsp;
            <input id="fname" type="text" required required><br><br>
            <label for="dob">date of birth</label>&nbsp;
            <input id="dob" type="date" required>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label required>Gender</label>&nbsp;
            <input type="radio" name="gen">Female
            <input type="radio" name="gen">Male<br><br>
            <label>Age As on</label>&nbsp;
            <input type="number" id="year">
            <label for="year">Year(s)</label>&nbsp;
            <input type="number" id = "month">
            <label for="month">Month(s)</label>&nbsp;
            <input type="number" id ="days">
            <label for="days">Day(s)</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label for="aadhar">Aadhar No</label>&nbsp;
            <input id="aadhar" type="tel" maxlength="12" ><br><br>
            <label for="num">Whatsapp No</label>&nbsp;
            <input id="num" type="tel" maxlength="10" required>&emsp;&emsp;&emsp;
            <label for="mail">E-mail Id</label>&nbsp;
            <input id="mail" type="email" required><br><br>
            <label for="photo">Photo</label>&nbsp;
            <input id="photo" type="file" required>
        </fieldset><br>
        <fieldset>
            <legend><b>RESIDENTAL ADRESS DETAILS</b></legend>
            <label for="addr">Applicant's Address</label>&nbsp;
                <textarea id="addr" rows="5" cols="20" maxlength="200"></textarea>&emsp;&emsp;&emsp;
            <label for="dis">District</label>&nbsp;
            <select name="districtname" id="dis">
                <option value="Hyderabad">Hyderabad</option>
            </select><br><br>
            <label for="mandal">Mandal</label>&nbsp;
            <select name="mandalname" id="mandal">
                <option value="Hyderabad">Hyderabad</option>
            </select>&emsp;&emsp;&emsp;
            <label for="vlg">Village</label>&nbsp;
            <select name="villagename" id="vlg">
                <option value="Hyderabad">Hyderabad</option>
            </select><br><br>
            <label for="pin">Pincode</label>&nbsp;
            <input id="pin" type="tel" maxlength="6" required>
        </fieldset><br>
        <fieldset>
            <legend><b>PASS TYPE DETAILS</b></legend>
            <label for="city">City</label>&nbsp;
            <select name="cityname" id="city">
                <option value="Hyderabad">Hyderabad</option>
            </select><br><br>
            <label for="pass">Pass Type</label>&nbsp;
            <select name="typeofpass" id="pass">
                <option value="----Select----" selected>----Select----</option>
                <option value="GREATER PASS">GREATER PASS</option>
                <option value="GENERAL ORDINARY ROUTE PASS MTLY">GENERAL ORDINARY ROUTE PASS MTLY</option>
                <option value="GENERAL METRO EXPRESS ROUTE PASS MTLY">GENERAL METRO EXPRESS ROUTE PASS MTLY</option>
                <option value="ORDINARY PASS">ORDINARY PASS</option>
                <option value="METRO EXPRESS PASS">METRO EXPRESS PASS</option>
                <option value="METRO DELUXE PASS">METRO DELUXE PASS</option>
            </select> 
        </fieldset><br>
        <fieldset>
            <legend><b>MODE OF PAYMENT & PASS COLLECTION</b></legend>
            <label for="pay">Payment Mode</label>&nbsp;
            <select name="paymentmode" id="pay">
                <option value="Select Payment Mode" selected>Select Payment Mode</option>
                <option value="Payment at Counter">Payment at Counter</option>
            </select><br><br>
            <label for="del">Pass Delivery Mode</label>&nbsp;
            <select name="deliverytype" id="del">
                <option value="Select Pass Delivery Mode" selected>Select Pass Delivery Mode</option>
                <option value="At Counter">At Counter</option>
            </select><br><br>
            <label for="center">Center at which you want to Collect Pass</label>&nbsp;
            <select name="centertorecieve" id="center">
                <option value="----Select----" selected>----Select----</option>
                <option value="RTC AFZALGUNJ -- HYD [30/09/2026]">RTC AFZALGUNJ -- HYD [30/09/2026]</option>
                <option value="RTC ARAMGHAR -- HYD [30/09/2026]">RTC ARAMGHAR -- HYD [30/09/2026]</option>
                <option value="RTC AIRPORT -- HYD [30/09/2026]">RTC AIRPORT-- HYD [30/09/2026]</option>
                <option value="RTC BALANAGAR -- HYD [30/09/2026]">RTC BALANAGAR -- HYD [30/09/2026]</option>
                <option value="RTC BORABANDA -- HYD [30/09/2026]">RTC BORABANDA -- HYD [30/09/2026]</option>
                <option value="RTC CBC -- HYD [30/09/2026]">RTC CBC -- HYD [30/09/2026]</option>
                <option value="RTC CHARMINAR -- HYD [30/09/2026]">RTC CHARMINAR -- HYD [30/09/2026]</option>
                <option value="RTC DILSUKHNAGAR -- HYD [30/09/2026]">RTC DILSUKHNAGAR -- HYD [30/09/2026]</option>
                <option value="RTC ECIL -- HYD [30/09/2026]">RTC ECIL -- HYD [30/09/2026]</option>
                <option value="RTC FAROOQNAGAR -- HYD [30/09/2026]">RTC FAROOQNAGAR -- HYD [30/09/2026]</option>
                <option value="RTC GHATKESAR -- HYD [30/09/2026]">RTC GHATKESAR -- HYD [30/09/2026]</option>
                <option value="RTC HAYATHNAGAR -- HYD [30/09/2026]">RTC HAYATHNAGAR -- HYD [30/09/2026]</option>
            </select>
        </fieldset><br>
        <input type="submit">
    </form>
</body>
</html>
